apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
data:
  JWT_HTTP_ONLY: 'true'
  JWT_DURATION: '3600000'
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-credentials
type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      automountServiceAccountToken: false
      containers:
      - name: auth
        image: pato-nego/auth:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: auth-config
        env:
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: auth-credentials
              key: JWT_SECRET_KEY
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /auth/health-check
            port: http
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /auth/health-check
            port: http
          timeoutSeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /auth/health-check
            port: http
          timeoutSeconds: 3
          periodSeconds: 15
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  type: ClusterIP
  selector:
    app: auth
  ports:
  - name: http
    port: 8080
    targetPort: http
